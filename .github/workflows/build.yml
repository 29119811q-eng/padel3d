name: Build Padel3D (iOS Simulator)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Padel3D.xcodeproj \
            -scheme Padel3D \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      - name: Build for iPhone (unsigned IPA for Sideloadly)
        run: |
          set -o pipefail
          xcodebuild -project Padel3D.xcodeproj \
            -scheme Padel3D \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-device.log

      - name: Pack IPA
        run: |
          APP_PATH=$(find build-device/Build/Products -name "*.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Padel3D-iPhone.ipa Payload
          ls -lh Padel3D-iPhone.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Padel3D-iPhone
          path: Padel3D-iPhone.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
